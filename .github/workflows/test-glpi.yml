name: Test GLPI API
 
on:
  workflow_dispatch:
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    steps:
      - name: Test Token
        run: |
          TOKEN=$(curl -s \
            -u "${{ secrets.GLPI_CLIENT_ID }}:${{ secrets.GLPI_CLIENT_SECRET }}" \
            -X POST "${{ secrets.GLPI_URL }}/api.php/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=password" \
            -d "username=${{ secrets.GLPI_USERNAME }}" \
            -d "password=${{ secrets.GLPI_PASSWORD }}" \
            | jq -r '.access_token')
      
          echo "Token Length: ${#TOKEN}"
      
          curl -s \
            -w "\nHTTP_CODE=%{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" \
            "${{ secrets.GLPI_URL }}/api.php/v2.2/user"
