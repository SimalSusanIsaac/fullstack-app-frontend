name: Create GLPI Change

on:
  push:
    branches:
      - main

jobs:
  create-change:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GLPI
        run: |
          TOKEN=$(curl -s \
            -u "${{ secrets.GLPI_CLIENT_ID }}:${{ secrets.GLPI_CLIENT_SECRET }}" \
            -X POST "${{ secrets.GLPI_URL }}/api.php/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=password" \
            -d "username=${{ secrets.GLPI_USERNAME }}" \
            -d "password=${{ secrets.GLPI_PASSWORD }}" \
            -d "scope=api" \
            | jq -r '.access_token')

          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

          echo "Authentication completed"

      - name: Test GLPI Connectivity
        run: |

          echo "Testing connectivity to GLPI..."

          curl -v --connect-timeout 30 \
            "${{ secrets.GLPI_URL }}/api.php/v2.2/"

      - name: Test Change Endpoint
        run: |

          echo "Testing Change API endpoint..."

          curl -v --connect-timeout 30 \
            -H "Authorization: Bearer $TOKEN" \
            "${{ secrets.GLPI_URL }}/api.php/v2.2/Assistance/Change"

      - name: Dump Full Change JSON
        run: |
      
          curl -s \
            -H "Authorization: Bearer $TOKEN" \
            "${{ secrets.GLPI_URL }}/api.php/v2.2/Assistance/Change/26" | jq .
